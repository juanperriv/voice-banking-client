<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎤 Voice Banking Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .status {
            text-align: center;
            padding: 15px;
            margin: 20px 0;
            border-radius: 10px;
            background: #f0f0f0;
            font-weight: 500;
        }
        .status.recording { background: #ffebee; color: #c62828; }
        .status.processing { background: #fff3e0; color: #e65100; }
        .status.success { background: #e8f5e9; color: #2e7d32; }
        .controls {
            display: flex;
            gap: 15px;
            margin: 30px 0;
        }
        button {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .record-btn {
            background: #f44336;
            color: white;
        }
        .record-btn:hover { background: #d32f2f; transform: translateY(-2px); }
        .record-btn.recording {
            background: #c62828;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .test-btn {
            background: #2196f3;
            color: white;
        }
        .test-btn:hover { background: #1976d2; transform: translateY(-2px); }
        .response {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            min-height: 100px;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
        .metadata {
            margin-top: 15px;
            padding: 15px;
            background: #263238;
            color: #aed581;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Voice Banking Assistant</h1>
        
        <div class="status" id="status">Listo para grabar</div>

        <div class="controls">
            <button class="record-btn" id="recordBtn">🎙️ Grabar</button>
            <button class="test-btn" id="testBtn">💬 Texto</button>
        </div>

        <div class="response" id="response">
            <p><strong>Ejemplos de consultas:</strong></p>
            <p>• "Quiero consultar mi saldo de ahorros"</p>
            <p>• "Transferir 50000 pesos a la cuenta corriente"</p>
            <p>• "Pagar el servicio de luz"</p>
        </div>

        <audio id="audioPlayer" controls style="display:none;"></audio>
        <div class="metadata" id="metadata" style="display:none;"></div>
    </div>

    <script>
        const API_URL = 'https://voice.insoftcol.com.co';
        const recordBtn = document.getElementById('recordBtn');
        const testBtn = document.getElementById('testBtn');
        const status = document.getElementById('status');
        const response = document.getElementById('response');
        const audioPlayer = document.getElementById('audioPlayer');
        const metadata = document.getElementById('metadata');

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        async function initRecorder() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    audioChunks = [];
                    await sendAudio(audioBlob);
                };
                
                status.textContent = '✅ Micrófono listo';
                status.className = 'status success';
            } catch (error) {
                status.textContent = '❌ Error: No se puede acceder al micrófono';
                status.className = 'status';
                console.error(error);
            }
        }

        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder) {
                await initRecorder();
            }

            if (!isRecording) {
                audioChunks = [];
                mediaRecorder.start();
                isRecording = true;
                recordBtn.textContent = '⏹️ Detener';
                recordBtn.classList.add('recording');
                status.textContent = '🔴 Grabando... Habla ahora';
                status.className = 'status recording';
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.textContent = '🎙️ Grabar';
                recordBtn.classList.remove('recording');
                status.textContent = '⏳ Procesando...';
                status.className = 'status processing';
            }
        });

        async function sendAudio(audioBlob) {
            const formData = new FormData();
            formData.append('audio', audioBlob, 'recording.wav');
            formData.append('sender', 'web_user_' + Date.now());

            try {
                const res = await fetch(`${API_URL}/voice-chat`, {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    const audioResponseBlob = await res.blob();
                    const audioUrl = URL.createObjectURL(audioResponseBlob);
                    
                    audioPlayer.src = audioUrl;
                    audioPlayer.style.display = 'block';
                    audioPlayer.play();
                    
                    status.textContent = '✅ Respuesta recibida';
                    status.className = 'status success';
                    response.innerHTML = '<p><strong>🔊 Escucha la respuesta del asistente bancario</strong></p>';
                    
                    const sender = formData.get('sender');
                    await getMetadata(sender);
                } else {
                    status.textContent = '❌ Error en la respuesta';
                    status.className = 'status';
                    response.textContent = 'Error: ' + res.statusText;
                }
            } catch (error) {
                status.textContent = '❌ Error de conexión';
                status.className = 'status';
                response.textContent = 'Error: ' + error.message;
                console.error(error);
            }
        }

        async function getMetadata(senderId) {
            try {
                const res = await fetch(`${API_URL}/metadata/${senderId}`);
                if (res.ok) {
                    const data = await res.json();
                    metadata.style.display = 'block';
                    metadata.textContent = JSON.stringify(data, null, 2);
                }
            } catch (error) {
                console.error('Error obteniendo metadata:', error);
            }
        }

        testBtn.addEventListener('click', async () => {
            const message = prompt('Escribe tu consulta:', 'quiero consultar mi saldo de ahorros');
            if (!message) return;

            status.textContent = '⏳ Procesando...';
            status.className = 'status processing';
            
            try {
                const res = await fetch(`${API_URL}/text-only`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        sender: 'web_test_' + Date.now()
                    })
                });

                if (res.ok) {
                    const data = await res.json();
                    status.textContent = '✅ Respuesta recibida';
                    status.className = 'status success';
                    
                    const rasaResp = data.rasa_response[0];
                    response.innerHTML = `
                        <p><strong>Tú:</strong> ${data.user_message}</p>
                        <p><strong>Bot:</strong> ${rasaResp.text}</p>
                    `;
                    
                    if (data.rasa_response.length > 1) {
                        metadata.style.display = 'block';
                        metadata.textContent = JSON.stringify(data.rasa_response[1].custom, null, 2);
                    }
                } else {
                    status.textContent = '❌ Error';
                    status.className = 'status';
                    response.textContent = 'Error: ' + res.statusText;
                }
            } catch (error) {
                status.textContent = '❌ Error de conexión';
                status.className = 'status';
                response.textContent = 'Error: ' + error.message;
            }
        });

        // Health check al cargar
        fetch(`${API_URL}/health`)
            .then(res => res.json())
            .then(data => {
                console.log('✅ Sistema healthy:', data);
            })
            .catch(err => {
                status.textContent = '⚠️ Advertencia: API no responde';
                status.className = 'status';
                console.error(err);
            });
    </script>
</body>
</html>
